{% extends "base.html" %}
{% block title %}{{ 'Edit Vendor' if vendor else 'Add Vendor' }} - Clips Admin{% endblock %}

{% block content %}
<div class="page-header">
    <h1>
        <i class="bi bi-shop"></i>
        {{ 'Edit Vendor' if vendor else 'Add Vendor' }}
    </h1>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header form-card-header">
                {{ 'Edit Vendor' if vendor else 'Add Vendor' }}
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Vendor Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="name" required
                                   value="{{ vendor.name if vendor else '' }}"
                                   placeholder="e.g., Home Depot">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contact Name</label>
                            <input type="text" class="form-control" name="contact_name"
                                   value="{{ vendor.contact_name if vendor else '' }}"
                                   placeholder="e.g., John Smith">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone"
                                   value="{{ vendor.phone if vendor else '' }}"
                                   placeholder="(555) 000-0000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email"
                                   value="{{ vendor.email if vendor else '' }}"
                                   placeholder="vendor@example.com">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address"
                                   value="{{ vendor.address if vendor else '' }}"
                                   placeholder="123 Main St, City, State">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" name="notes" rows="3"
                                      placeholder="Account number, preferred payment terms, etc.">{{ vendor.notes if vendor else '' }}</textarea>
                        </div>
                        {% if vendor %}
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="active" id="activeCheck"
                                       {% if vendor.active %}checked{% endif %}>
                                <label class="form-check-label" for="activeCheck">Active</label>
                            </div>
                        </div>
                        {% endif %}
                    </div>

                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-green">
                            <i class="bi bi-check-lg"></i>
                            {{ 'Save Changes' if vendor else 'Create Vendor' }}
                        </button>
                        <a href="{{ url_for('vendors.vendor_list') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
