{% extends "portal_base.html" %}
{% block title %}Payment Cancelled - Clips{% endblock %}

{% block content %}
<div class="text-center py-5 px-3">
    <div class="portal-status-icon" style="background: var(--amber-100);">
        <i class="bi bi-x-lg" style="color: var(--amber-700);"></i>
    </div>
    <h2 class="mb-3">Payment Cancelled</h2>
    <p class="text-muted mb-4">
        Your payment was not completed. No charges have been made.
    </p>
    <a href="{{ url_for('portal.portal_dashboard') }}" class="btn btn-green btn-lg">
        <i class="bi bi-arrow-left"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
