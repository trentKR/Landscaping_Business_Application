<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - Clips</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Favicon Light Green.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="card login-card">
                <div class="login-header">
                    <img src="{{ url_for('static', filename='logo_green.png') }}" alt="Clips" class="login-logo">
                    <p class="portal-subtitle">Employee Portal</p>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>
                    {% endfor %}
                    {% endif %}
                    {% endwith %}

                    <form method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   required autofocus autocomplete="email"
                                   placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   required autocomplete="current-password"
                                   placeholder="Enter your password">
                        </div>
                        <button type="submit" class="btn btn-green w-100 py-2">
                            <i class="bi bi-box-arrow-in-right"></i> Sign In
                        </button>
                    </form>
                    <hr class="my-3">
                    <p class="portal-help-text">
                        Need access or forgot your password?
                    </p>
                    <form method="POST" action="{{ url_for('staff.staff_request_link') }}" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-2">
                            <input type="email" class="form-control form-control-sm" name="email"
                                   required placeholder="Enter your email address" autocomplete="email">
                        </div>
                        <button type="submit" class="btn btn-outline-secondary w-100 btn-sm">
                            <i class="bi bi-envelope"></i> Email Me a Link
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('landing.home') }}" class="back-link">
                            <i class="bi bi-arrow-left"></i> Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
