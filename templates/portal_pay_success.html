{% extends "portal_base.html" %}
{% block title %}Payment Successful - Clips{% endblock %}

{% block content %}
<div class="text-center py-5 px-3">
    <div class="portal-status-icon" style="background: var(--green-100);">
        <i class="bi bi-check-lg" style="color: var(--primary);"></i>
    </div>
    <h2 class="mb-3">Payment Successful</h2>
    <p class="text-muted mb-4">
        Your payment has been received. It may take a moment for your account to update.
    </p>
    <a href="{{ url_for('portal.portal_dashboard') }}" class="btn btn-green btn-lg">
        <i class="bi bi-arrow-left"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
