{% extends "base.html" %}
{% block title %}{{ 'Edit' if client else 'New' }} Client - Clips Admin{% endblock %}

{% block content %}
<div class="page-header">
    <h1>
        <i class="bi bi-{{ 'pencil' if client else 'person-plus' }}"></i>
        {{ 'Edit' if client else 'New' }} Client
    </h1>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header form-card-header">
                {{ 'Edit Client' if client else 'New Client' }}
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="first_name" name="first_name"
                                   value="{{ client.first_name if client else '' }}" required>
                        </div>
                        <div class="col-md-3">
                            <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="last_name" name="last_name"
                                   value="{{ client.last_name if client else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone"
                                   value="{{ client.phone if client else '' }}"
                                   placeholder="(555) 123-4567">
                        </div>
                        <div class="col-12">
                            <label for="address_street" class="form-label">Street Address</label>
                            <input type="text" class="form-control" id="address_street" name="address_street"
                                   value="{{ client.address_street if client else '' }}">
                        </div>
                        <div class="col-md-5">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" name="city"
                                   value="{{ client.city if client else '' }}">
                        </div>
                        <div class="col-md-3">
                            <label for="state" class="form-label">State</label>
                            <input type="text" class="form-control" id="state" name="state"
                                   value="{{ client.state if client else '' }}"
                                   maxlength="2" placeholder="VA" style="text-transform: uppercase;">
                        </div>
                        <div class="col-md-4">
                            <label for="zip_code" class="form-label">Zip Code</label>
                            <input type="text" class="form-control" id="zip_code" name="zip_code"
                                   value="{{ client.zip_code if client else '' }}"
                                   maxlength="10" placeholder="12345">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   value="{{ client.email if client else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="default_mowing_rate" class="form-label">Default Mowing Rate</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       id="default_mowing_rate" name="default_mowing_rate"
                                       value="{{ client.default_mowing_rate if client else '' }}"
                                       placeholder="0.00">
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_weekly"
                                       name="is_weekly" {% if client and client.is_weekly %}checked{% endif %}>
                                <label class="form-check-label" for="is_weekly">
                                    Weekly mowing customer
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="route_id" class="form-label">Mowing Route</label>
                            <select class="form-select" id="route_id" name="route_id">
                                <option value="">Select a route...</option>
                                {% for r in routes %}
                                <option value="{{ r.id }}" {% if client and client.route_id == r.id %}selected{% endif %}>
                                    {{ r.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        {% if client %}
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="active"
                                       name="active" {% if client.active %}checked{% endif %}>
                                <label class="form-check-label" for="active">Active</label>
                            </div>
                        </div>
                        {% endif %}
                        <div class="col-12">
                            <label for="notes" class="form-label">Notes / Special Instructions</label>
                            <textarea class="form-control" id="notes" name="notes"
                                      rows="3" placeholder="Gate code, dog in backyard, etc.">{{ client.notes if client else '' }}</textarea>
                        </div>
                    </div>
                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-green">
                            <i class="bi bi-check-lg"></i>
                            {{ 'Save Changes' if client else 'Create Client' }}
                        </button>
                        <a href="{{ url_for('clients.client_detail', client_id=client.id) if client else url_for('clients.clients') }}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
